name: Validate installer UI

on:
  workflow_dispatch:
  push:
    branches: [codex/files-resource-manager]
    paths:
      - '.github/installer/ba/**'
      - '.github/installer/verification/**'
      - '.github/workflows/validate-installer-ui.yml'

permissions:
  contents: read

concurrency:
  group: installer-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Compile and verify WPF pages without building an installer
        shell: pwsh
        run: |
          dotnet run --project .github/installer/verification/FilesMax.Installer.Verification.csproj --configuration Release -- artifacts/installer-ui-review
          if ($LASTEXITCODE -ne 0) { throw 'Installer UI verification failed.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Installer UI review
          path: artifacts/installer-ui-review/*.png
          if-no-files-found: warn
          retention-days: 14
