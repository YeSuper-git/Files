name: Files max validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: files-max-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-max-build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Verify icon variants have no blue backplate
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\src\Files.App\Assets\AppTiles\Taskbar\Verify-TaskbarIcons.ps1"'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v3
      - uses: NuGet/setup-nuget@v4
      - name: Restore Files max solution
        shell: pwsh
        run: |
          msbuild "$env:GITHUB_WORKSPACE\Files.slnx" `
            -m -t:Restore `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -v:quiet -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) {
            throw 'Files max solution restore failed.'
          }
      - name: Build Files max installer application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild "$env:GITHUB_WORKSPACE\src\Files.App\Files.App.csproj" `
            -m -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:WindowsPackageType=None `
            -p:FilesExternalLocationBuild=true `
            -p:FilesResourceManagerBuild=true `
            -p:PublishAot=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -v:quiet -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) {
            throw 'Files max Release build failed.'
          }
