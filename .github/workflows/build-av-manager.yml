name: Build AV Resource Manager

on:
  push:
    branches: [main, feature/av-resource-manager]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_PATH: ${{ github.workspace }}\Files.slnx
  APP_PROJECT_PATH: ${{ github.workspace }}\src\Files.App\Files.App.csproj

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild ${{ env.SOLUTION_PATH }} -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build
        run: msbuild ${{ env.APP_PROJECT_PATH }} -p:Configuration=Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:AppxPackageDir=${{ github.workspace }}\artifacts\AppxPackages\ -v:minimal

      - name: Sign and Package
        shell: pwsh
        run: |
          # Generate self-signed cert
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Files AV Manager" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256
          $pfxPath = "${{ github.workspace }}\sign.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password (ConvertTo-SecureString "FilesAV" -Force -AsPlainText)
          $cerPath = "${{ github.workspace }}\FilesAVManager.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT

          # Sign msix files
          $kitsDir = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $kitsDir.FullName "x64\signtool.exe"
          Get-ChildItem "artifacts\AppxPackages\**\*.msix" | ForEach-Object {
            Write-Host "Signing: $($_.Name)"
            & $signtool sign /f $pfxPath /p "FilesAV" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item $pfxPath -Force

          # Package
          $pkg = "${{ github.workspace }}\package"
          New-Item -ItemType Directory -Path $pkg -Force
          Copy-Item "artifacts\AppxPackages\**\*.msix" $pkg -Force
          Copy-Item $cerPath $pkg
          Copy-Item "${{ github.workspace }}\install.bat" $pkg -Force
          Compress-Archive -Path "$pkg\*" -DestinationPath "${{ github.workspace }}\Files-AV-Manager.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Files-AV-Manager
          path: Files-AV-Manager.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Files-AV-Manager.zip
          draft: false
          body: |
            ## Files AV Resource Manager

            ### 安装方法
            1. 下载 zip 解压
            2. 右键 安装.bat -> 以管理员身份运行
            3. 等待完成，开始菜单搜索 Files 打开

            ### 功能
            - Files App 完整文件管理器
            - AV 资源番号自动识别
            - 资源健康检查 / 批量重命名
            - 无字幕分类 / 操作撤销
