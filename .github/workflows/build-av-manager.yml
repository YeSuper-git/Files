name: Build AV Resource Manager

on:
  push:
    branches: [main, feature/av-resource-manager]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_PATH: ${{ github.workspace }}\Files.slnx
  APP_PROJECT_PATH: ${{ github.workspace }}\src\Files.App\Files.App.csproj

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild ${{ env.SOLUTION_PATH }} -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build
        run: msbuild ${{ env.APP_PROJECT_PATH }} -p:Configuration=Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:AppxPackageDir=${{ github.workspace }}\artifacts\AppxPackages\ -v:minimal

      - name: Package
        shell: pwsh
        run: |
          $pkg = "${{ github.workspace }}\Files-AV-Manager"
          New-Item -ItemType Directory -Path $pkg -Force

          # Copy msix files
          Get-ChildItem "artifacts\AppxPackages\**\*.msix" | ForEach-Object {
            Copy-Item $_.FullName $pkg
            Write-Host "Added: $($_.Name)"
          }

          # Create install script
          $script = @'
          $ErrorActionPreference = "Stop"
          Write-Host ""
          Write-Host "  Files AV Resource Manager 安装程序" -ForegroundColor Cyan
          Write-Host "  =========================================" -ForegroundColor Cyan
          Write-Host ""

          $scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path

          # Install runtime
          Write-Host "[1/2] 安装 Windows App Runtime..." -ForegroundColor Yellow
          $runtime = Get-ChildItem $scriptDir -Filter "*.msix" | Where-Object { $_.Name -like "Microsoft*" } | Select-Object -First 1
          if ($runtime) {
            try { Add-AppxPackage -Path $runtime.FullName -ErrorAction Stop; Write-Host "  完成" -ForegroundColor Green }
            catch { Write-Host "  已安装或跳过" -ForegroundColor Gray }
          }

          # Install app
          Write-Host ""
          Write-Host "[2/2] 安装 Files AV Manager..." -ForegroundColor Yellow
          $app = Get-ChildItem $scriptDir -Filter "Files.App_*.msix" | Select-Object -First 1
          if ($app) {
            Add-AppxPackage -Path $app.FullName -AllowUnsigned
            if ($LASTEXITCODE -eq 0) {
              Write-Host ""
              Write-Host "  =========================================" -ForegroundColor Green
              Write-Host "  安装完成! 开始菜单搜索 Files 打开" -ForegroundColor Green
              Write-Host "  =========================================" -ForegroundColor Green
            } else {
              Write-Host "  安装失败，请开启开发者模式" -ForegroundColor Red
              Write-Host "  设置 -> 开发者选项 -> 开发人员模式" -ForegroundColor Red
            }
          }

          Write-Host ""
          Read-Host "按回车退出"
          '@
          Set-Content -Path "$pkg\安装.ps1" -Value $script -Encoding UTF8

          # Create shortcut bat
          $bat = '@echo off
          powershell -ExecutionPolicy Bypass -File "%~dp0安装.ps1"'
          Set-Content -Path "$pkg\安装.bat" -Value $bat -Encoding Default

          # Zip
          Compress-Archive -Path "$pkg\*" -DestinationPath "${{ github.workspace }}\Files-AV-Manager.zip"
          Get-ChildItem "${{ github.workspace }}\Files-AV-Manager.zip" | Select-Object Name, @{N="MB";E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Files-AV-Manager
          path: Files-AV-Manager.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Files-AV-Manager.zip
          draft: false
          body: |
            ## Files AV Resource Manager

            ### 安装方法
            1. 下载 zip 解压
            2. 双击 `安装.bat`
            3. 完成后开始菜单搜索 Files 打开

            ### 功能
            - Files App 完整文件管理器
            - AV 资源番号自动识别
            - 资源健康检查 / 批量重命名
            - 无字幕分类 / 操作撤销
