name: Build AV Resource Manager

on:
  push:
    branches: [main, feature/av-resource-manager]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Restore
        run: msbuild ${{ github.workspace }}\Files.slnx -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build
        run: msbuild ${{ github.workspace }}\src\Files.App\Files.App.csproj -p:Configuration=Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:AppxPackageDir=${{ github.workspace }}\artifacts\AppxPackages\ -v:minimal

      - name: Sign MSIX
        shell: pwsh
        run: |
          # Create self-signed cert
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Files AV Manager" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5) -KeyUsage DigitalSignature -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfxPath = "${{ github.workspace }}\sign.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password (ConvertTo-SecureString "FAV2026" -Force -AsPlainText)
          $cerPath = "${{ github.workspace }}\FilesAVManager.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem "artifacts\AppxPackages\**\*.msix" | ForEach-Object {
            Write-Host "Signing: $($_.Name)"
            & $signtool sign /f $pfxPath /p "FAV2026" /fd SHA256 $_.FullName
          }
          Remove-Item $pfxPath -Force

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          # Prepare installer files
          $instDir = "${{ github.workspace }}\installer"
          New-Item -ItemType Directory -Path $instDir -Force
          Copy-Item "artifacts\AppxPackages\**\*.msix" $instDir -Force
          Copy-Item "${{ github.workspace }}\FilesAVManager.cer" $instDir -Force

          # Create NSIS script
          $nsis = @"
          !include "MUI2.nsh"
          !include "FileFunc.nsh"

          Name "Files AV Resource Manager"
          OutFile "${{ github.workspace }}\Files-AV-Manager-Setup.exe"
          InstallDir "`$PROGRAMFILES\FilesAVManager"
          RequestExecutionLevel admin
          Unicode True

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "SimpChinese"

          Section "Install"
            SetOutPath "`$INSTDIR"

            # Copy files
            File "${{ github.workspace }}\installer\FilesAVManager.cer"
            File /nonfatal "${{ github.workspace }}\installer\Microsoft.WindowsAppRuntime.2.msix"
            File /nonfatal "${{ github.workspace }}\installer\Files.App_*.msix"

            # Install certificate to trusted root
            nsExec::ExecToStack 'certutil -addstore "Root" "`$INSTDIR\FilesAVManager.cer"'

            # Install runtime
            DetailPrint "Installing Windows App Runtime..."
            nsExec::ExecToStack 'powershell -Command "Add-AppxPackage -Path (Get-ChildItem ''`$INSTDIR\Microsoft*.msix'' | Select-Object -First 1).FullName"'

            # Install app
            DetailPrint "Installing Files AV Manager..."
            nsExec::ExecToStack 'powershell -Command "Add-AppxPackage -Path (Get-ChildItem ''`$INSTDIR\Files.App_*.msix'' | Select-Object -First 1).FullName"'

            # Create uninstaller
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "`$INSTDIR\*.msix"
            Delete "`$INSTDIR\*.cer"
            Delete "`$INSTDIR\Uninstall.exe"
            RMDir "`$INSTDIR"
          SectionEnd
          "@

          Set-Content -Path "$instDir\installer.nsi" -Value $nsis -Encoding UTF8

          # Build
          & "C:\Program Files (x86)\NSIS\makensis.exe" "$instDir\installer.nsi"
          Get-ChildItem "${{ github.workspace }}\Files-AV-Manager-Setup.exe" | Select-Object Name, @{N="MB";E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Files-AV-Manager
          path: Files-AV-Manager-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Files-AV-Manager-Setup.exe
          draft: false
          body: |
            ## Files AV Resource Manager

            ### Install
            Download `Files-AV-Manager-Setup.exe`, double-click to install.
            Automatically installs certificate, runtime, and app.

            ### Features
            - Full Files App file manager
            - AV resource code detection
            - Health check / batch rename
            - Subtitle classification / undo
