name: Build AV Resource Manager

on:
  push:
    branches: [main, feature/av-resource-manager]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_PATH: "${{ github.workspace }}\\Files.slnx"
  APP_PROJECT_PATH: "${{ github.workspace }}\\src\\Files.App\\Files.App.csproj"

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: msbuild ${{ env.SOLUTION_PATH }} -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build
        run: msbuild ${{ env.APP_PROJECT_PATH }} -p:Configuration=Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:AppxPackageDir="${{ github.workspace }}\\artifacts\\AppxPackages\\" -v:minimal

      - name: Prepare combined package
        shell: pwsh
        run: |
          $pkgDir = "${{ github.workspace }}\package"
          New-Item -ItemType Directory -Path $pkgDir -Force
          
          # 复制 msix 文件
          Copy-Item "artifacts/AppxPackages/**/*.msix" $pkgDir -Force
          Get-ChildItem $pkgDir
          
          # 创建安装脚本
          $installScript = @'
          @echo off
          chcp 65001 >nul
          title Files AV Resource Manager
          echo.
          echo  ==========================================
          echo   Files AV Resource Manager 安装程序
          echo  ==========================================
          echo.
          
          net session >nul 2>&1
          if %errorlevel% neq 0 (
              echo [提示] 需要管理员权限，正在请求提升...
              powershell -Command "Start-Process '%~f0' -Verb RunAs"
              exit /b
          )
          
          echo [1/2] 安装 Windows App Runtime...
          powershell -Command "Add-AppxPackage -Path '%~dp0Microsoft.WindowsAppRuntime.2.msix'" 2>nul
          echo       完成
          echo.
          
          echo [2/2] 安装 Files AV Resource Manager...
          powershell -Command "Add-AppxPackage -Path '%~dp0Files.App_*.msix'"
          echo.
          echo  ==========================================
          echo   安装完成！在开始菜单搜索 Files 打开
          echo  ==========================================
          echo.
          pause
          '@
          Set-Content -Path "$pkgDir\安装.bat" -Value $installScript -Encoding Default
          
          # 创建 zip
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "${{ github.workspace }}\Files-AV-Manager-v0.1.0-av.zip"
          Get-ChildItem "${{ github.workspace }}\Files-AV-Manager-v0.1.0-av.zip" | Select-Object Name, Length

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: Files-AV-Manager
          path: Files-AV-Manager-v0.1.0-av.zip
          if-no-files-found: warn

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Files-AV-Manager-msix
          path: artifacts/AppxPackages/**/*.msix
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Files-AV-Manager-v0.1.0-av.zip
            artifacts/AppxPackages/**/*.msix
          draft: false
          body: |
            ## Files AV Resource Manager ${{ github.ref_name }}

            ### 下载说明
            - **推荐**: 下载 `Files-AV-Manager-v0.1.0-av.zip`，解压后双击 `安装.bat` 即可
            - 会自动安装运行时依赖和主程序

            ### 功能
            - 📂 基于 Files App 的完整文件管理器
            - 🔍 AV 资源番号自动识别
            - 📊 资源健康检查
            - ✏️ 批量重命名
            - 🏷️ 无字幕分类
            - ↩️ 操作历史与撤销
