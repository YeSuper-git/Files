name: Build AV Resource Manager

on:
  push:
    branches: [main, feature/av-resource-manager]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Restore
        run: msbuild ${{ github.workspace }}\Files.slnx -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build
        run: msbuild ${{ github.workspace }}\src\Files.App\Files.App.csproj -p:Configuration=Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:AppxPackageDir=${{ github.workspace }}\artifacts\AppxPackages\ -v:minimal

      - name: Sign and Build Installer
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $publisher = "CN=Files AV Manager"

          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)) {
            throw "MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD GitHub Secrets are required"
          }

          # Reuse one long-lived certificate for stable package updates.
          $pfxPath = "${{ github.workspace }}\sign.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:MSIX_PFX_BASE64)
          )
          $pfxPassword = ConvertTo-SecureString $env:MSIX_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $pfxPassword

          if ($cert.Subject -ne $publisher) {
            throw "Certificate subject '$($cert.Subject)' does not match package publisher '$publisher'"
          }

          # AppX/MSIX checks the publisher identity and trusts this store for sideloading.
          $cerPath = "${{ github.workspace }}\FilesAVManager.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Confirm:$false | Out-Null

          # Sign only the application package. Runtime dependencies are already Microsoft-signed.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using: $signtool"

          $appPackages = @(Get-ChildItem "artifacts\AppxPackages" -Filter "Files.App_*.msix" -Recurse)
          if ($appPackages.Count -eq 0) {
            throw "Application MSIX package not found"
          }

          $appPackages | ForEach-Object {
            Write-Host "Signing: $($_.Name)"
            & $signtool sign /f $pfxPath /p $env:MSIX_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $_.FullName
            if ($LASTEXITCODE -eq 0) { Write-Host "  OK" -ForegroundColor Green }
            else { Write-Host "  FAILED (exit $LASTEXITCODE)" -ForegroundColor Red; throw "Sign failed" }
          }

          Remove-Item $pfxPath -Force

          # Prepare NSIS installer
          $instDir = "${{ github.workspace }}\installer"
          New-Item -ItemType Directory -Path $instDir -Force

          Copy-Item $cerPath $instDir
          $appMsix = Get-ChildItem "artifacts\AppxPackages\**\Files.App_*.msix" | Select-Object -First 1
          if (-not $appMsix) {
            throw "Application MSIX package not found for the installer"
          }

          # The packaged app is framework-dependent on Windows App Runtime.
          # The SDK restore contains the signed x64 runtime MSIX files, so ship
          # all of them in the installer instead of relying on a preinstalled
          # runtime on the target machine.
          $nugetRoot = if ([string]::IsNullOrWhiteSpace($env:NUGET_PACKAGES)) {
            Join-Path $env:USERPROFILE ".nuget\packages"
          } else {
            $env:NUGET_PACKAGES
          }
          $runtimePackageDir = Join-Path $nugetRoot "microsoft.windowsappsdk.runtime\2.4.0\tools\MSIX\win10-x64"
          $runtimePackages = @(Get-ChildItem -LiteralPath $runtimePackageDir -Filter "Microsoft.WindowsAppRuntime*.msix" -File)
          if ($runtimePackages.Count -lt 4) {
            throw "Windows App Runtime x64 packages were not found in $runtimePackageDir"
          }
          $runtimePackages | ForEach-Object { Copy-Item $_.FullName $instDir }

          Copy-Item $appMsix.FullName $instDir

          $appName = $appMsix.Name
          $runtimeFileDirectives = ($runtimePackages | ForEach-Object {
            "    File `"$instDir\$($_.Name)`""
          }) -join [Environment]::NewLine

          # Use a script file so paths with spaces never pass through nested
          # NSIS/PowerShell command-line quoting.
          $installScript = @'
          $ErrorActionPreference = 'Stop'

          try {
              $runtimePackages = @(Get-ChildItem -LiteralPath $PSScriptRoot -Filter 'Microsoft.WindowsAppRuntime*.msix' -File)
              $runtimeFramework = $runtimePackages |
                  Where-Object { $_.Name -eq 'Microsoft.WindowsAppRuntime.2.msix' } |
                  Select-Object -First 1
              $app = Get-ChildItem -LiteralPath $PSScriptRoot -Filter 'Files.App_*.msix' -File |
                  Select-Object -First 1

              if (-not $runtimeFramework) {
                  throw 'Windows App Runtime framework package was not found.'
              }

              if (-not $app) {
                  throw 'Application MSIX package was not found.'
              }

              $requiredRuntimeVersion = [version]'2.4.0.0'
              $installedRuntime = Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.2' -ErrorAction SilentlyContinue |
                  Where-Object { [version]$_.Version -ge $requiredRuntimeVersion } |
                  Select-Object -First 1

              if (-not $installedRuntime) {
                  $runtimeDependencies = @($runtimePackages |
                      Where-Object { $_.FullName -ne $runtimeFramework.FullName } |
                      Select-Object -ExpandProperty FullName)
                  Write-Host "Installing Windows App Runtime 2.4.0"
                  Add-AppxPackage -Path $runtimeFramework.FullName -DependencyPath $runtimeDependencies
              } else {
                  Write-Host "Windows App Runtime 2.4.0 or newer is already installed"
              }

              Write-Host "Installing Files AV Manager: $($app.Name)"
              Add-AppxPackage -Path $app.FullName
              exit 0
          }
          catch {
              Write-Error $_
              exit 1
          }
          '@
          Set-Content -Path "$instDir\Install-App.ps1" -Value $installScript -Encoding UTF8

          # NSIS script
          $nsis = @"
          Name "Files AV Resource Manager"
          OutFile "${{ github.workspace }}\Files-AV-Manager-Setup.exe"
          InstallDir "`$TEMP\FAVInstall"
          RequestExecutionLevel admin
          Unicode True

          Page instfiles

          Section "Install"
            SetOutPath "`$INSTDIR"
            File "$instDir\FilesAVManager.cer"
            File "$instDir\Install-App.ps1"
          $runtimeFileDirectives
            File "$instDir\$appName"

            # Trust certificate
            DetailPrint "Installing certificate..."
            ExecWait '"`$SYSDIR\certutil.exe" -addstore TrustedPeople "`$INSTDIR\FilesAVManager.cer"' `$0
            StrCmp `$0 "0" certificate_ok
            Abort "Certificate installation failed."
          certificate_ok:

            # Enable sideloading
            WriteRegDWORD HKLM "SOFTWARE\Microsoft\Windows\CurrentVersion\Appx" "AllowAllTrustedApps" 1

            # Install the runtime dependency, when present, and the app.
            DetailPrint "Installing Files AV Manager..."
            ExecWait '"`$SYSDIR\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "`$INSTDIR\Install-App.ps1"' `$0
            StrCmp `$0 "0" app_install_ok
            DetailPrint "Files AV Manager installation failed with exit code `$0."
            Abort "Files AV Manager installation failed."
          app_install_ok:

            RMDir /r "`$INSTDIR"
          SectionEnd
          "@

          Set-Content -Path "$instDir\installer.nsi" -Value $nsis -Encoding UTF8
          & "C:\Program Files (x86)\NSIS\makensis.exe" "$instDir\installer.nsi"

          $exe = "${{ github.workspace }}\Files-AV-Manager-Setup.exe"
          if (Test-Path $exe) {
            Get-ChildItem $exe | Select-Object Name, @{N="MB";E={[math]::Round($_.Length/1MB,1)}}
          } else {
            throw "NSIS build failed"
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Files-AV-Manager
          path: Files-AV-Manager-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Files-AV-Manager-Setup.exe
          draft: false
          body: |
            ## Files AV Resource Manager

            Download and double-click to install. Requires Windows 10/11.

            - Full Files App file manager
            - AV resource code detection
            - Health check / batch rename
            - Subtitle classification / undo
