name: Build Files Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Restore
        run: msbuild ${{ github.workspace }}\Files.slnx -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Restore launcher dependencies
        shell: pwsh
        run: |
          nuget restore "$env:GITHUB_WORKSPACE\src\Files.App.Launcher\Files.App.Launcher.vcxproj" `
            -SolutionDirectory "$env:GITHUB_WORKSPACE" `
            -Verbosity quiet

      - name: Build launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild "$env:GITHUB_WORKSPACE\src\Files.App.Launcher\Files.App.Launcher.vcxproj" `
            -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -v:minimal
          if (-not (Test-Path -LiteralPath "$env:GITHUB_WORKSPACE\src\Files.App\Assets\FilesOpenDialog\Files.App.Launcher.exe")) {
            throw 'Files.App.Launcher.exe was not produced.'
          }

      - name: Publish standard Files application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish'
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          msbuild "$env:GITHUB_WORKSPACE\src\Files.App\Files.App.csproj" `
            -t:Publish `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:WindowsPackageType=None `
            -p:FilesExternalLocationBuild=true `
            -p:FilesResourceManagerBuild=false `
            -p:GenerateAppxPackageOnBuild=false `
            "-p:PublishDir=$publishDir\" `
            -v:minimal

          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'Files.exe'))) {
            throw 'Baseline Files.exe was not produced.'
          }
          if ((Get-ChildItem -LiteralPath $publishDir -Filter 'Microsoft.WindowsAppRuntime*.dll' -File).Count -eq 0) {
            throw 'Windows App SDK self-contained runtime was not copied to the publish output.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'resources.pri'))) {
            throw 'resources.pri was not copied to the publish output.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'Assets'))) {
            throw 'Application assets were not copied to the publish output.'
          }
          $winrtHostPath = Join-Path $publishDir 'WinRT.Host.dll'
          if (-not (Test-Path -LiteralPath $winrtHostPath)) {
            $generatedHost = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\src\Files.App.BackgroundTasks\bin" -Recurse -Filter 'WinRT.Host.dll' -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($generatedHost) {
              Copy-Item -LiteralPath $generatedHost.FullName -Destination $winrtHostPath -Force
            }
          }
          if (-not (Test-Path -LiteralPath $winrtHostPath)) {
            throw 'WinRT.Host.dll was not copied to the publish output.'
          }

          $serverPublishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\server-publish'
          New-Item -ItemType Directory -Path $serverPublishDir -Force | Out-Null
          msbuild "$env:GITHUB_WORKSPACE\src\Files.App.Server\Files.App.Server.csproj" `
            -t:Publish `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            "-p:PublishDir=$serverPublishDir\" `
            -v:minimal

          $serverExe = Get-ChildItem -LiteralPath $serverPublishDir -Filter 'Files.App.Server.exe' -File | Select-Object -First 1
          if (-not $serverExe) {
            throw 'Files.App.Server.exe was not produced.'
          }
          $serverPayloadDir = Join-Path $publishDir 'Files.App.Server'
          New-Item -ItemType Directory -Path $serverPayloadDir -Force | Out-Null
          Copy-Item -Path (Join-Path $serverPublishDir '*') -Destination $serverPayloadDir -Recurse -Force

          # The baseline must not expose resource manager implementation files in its publish
          # directory. The compile-time switch is the source of truth; this
          # check catches an accidental reintroduction of a copied resource manager payload.
          if (Get-ChildItem -LiteralPath $publishDir -Recurse -File | Where-Object { $_.Name -match 'ResourceManager|files-resource-manager' }) {
            throw 'The standard baseline publish output contains resource manager implementation files.'
          }

      - name: Build identity package and traditional installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $publishDir = Join-Path $workspace 'artifacts\publish'
          $identityDir = Join-Path $workspace 'artifacts\identity'
          $identityPackage = Join-Path $workspace 'artifacts\Files.Identity.msix'
          $certificatePath = Join-Path $workspace 'artifacts\Files.cer'
          $vcRedistPath = Join-Path $workspace 'artifacts\VC_redist.x64.exe'
          $pfxPath = Join-Path $workspace 'artifacts\sign.pfx'

          $versionFile = Join-Path $workspace '.github\installer\build-version.txt'
          $installerVersion = (Get-Content -Raw -LiteralPath $versionFile).Trim()
          if ($installerVersion -notmatch '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$') {
            throw "Invalid canonical installer version in '$versionFile': $installerVersion"
          }
          $major = [int]$Matches.major
          $minor = [int]$Matches.minor
          $patch = [int]$Matches.patch
          if ($major -lt 1 -or $major -gt 255 -or $minor -gt 255 -or $patch -gt 65535) {
            throw "Canonical version exceeds Windows Installer limits: $installerVersion"
          }
          $appVersion = '{0}.{1}.{2}.0' -f $major, $minor, $patch

          New-Item -ItemType Directory -Path $identityDir -Force | Out-Null
          $identityManifestPath = Join-Path $identityDir 'AppxManifest.xml'
          Copy-Item "$workspace\.github\installer\ExternalLocation.Files.AppxManifest" $identityManifestPath -Force
          [xml]$identityManifest = Get-Content -LiteralPath $identityManifestPath
          $identityManifest.Package.Identity.Version = $appVersion
          $identityManifest.Save($identityManifestPath)
          if ($identityManifest.Package.Identity.Version -ne $appVersion) {
            throw "Generated baseline identity version mismatch: expected $appVersion, found $($identityManifest.Package.Identity.Version)."
          }

          $identityAssetDir = Join-Path $identityDir 'Assets\AppTiles\Dev'
          New-Item -ItemType Directory -Path $identityAssetDir -Force | Out-Null
          Copy-Item "$workspace\src\Files.App\Assets\AppTiles\Dev\StoreLogo.scale-100.png" $identityAssetDir -Force
          Copy-Item "$workspace\src\Files.App\Assets\AppTiles\Dev\Square150x150Logo.scale-100.png" $identityAssetDir -Force
          Copy-Item "$workspace\src\Files.App\Assets\AppTiles\Dev\Square44x44Logo.scale-100.png" $identityAssetDir -Force
          $taskbarIconSourceDir = Join-Path $workspace 'src\Files.App\Assets\AppTiles\Dev'
          $taskbarIconSizes = @('16', '20', '24', '30', '32', '36', '40', '48', '60', '64', '72', '80', '96', '256')
          foreach ($size in $taskbarIconSizes) {
            foreach ($variant in @("${size}_altform-unplated.png", "${size}_altform-lightunplated_theme-light.png")) {
              $assetName = "Square44x44Logo.targetsize-$variant"
              $assetPath = Join-Path $taskbarIconSourceDir $assetName
              if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                throw "Required Windows taskbar icon variant is missing: $assetPath"
              }
            }
          }
          $taskbarIconAssets = @(Get-ChildItem -LiteralPath $taskbarIconSourceDir -Filter 'Square44x44Logo.targetsize-*_altform-*.png' -File)
          Copy-Item -LiteralPath $taskbarIconAssets.FullName -Destination $identityAssetDir -Force
          $archiveAssetDir = Join-Path $identityDir 'Assets\archives'
          New-Item -ItemType Directory -Path $archiveAssetDir -Force | Out-Null
          Copy-Item "$workspace\src\Files.App\Assets\archives\ExtensionIcon.png" $archiveAssetDir -Force

          $makeAppx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeAppx -or -not $signtool) {
            throw 'Windows SDK makeappx.exe or signtool.exe was not found.'
          }

          & $makeAppx pack /o /d $identityDir /nv /p $identityPackage
          if ($LASTEXITCODE -ne 0) {
            throw "Identity package creation failed with exit code $LASTEXITCODE."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $identityArchive = [IO.Compression.ZipFile]::OpenRead($identityPackage)
          try {
            $missingPackagedTaskbarIcons = @(
              foreach ($asset in $taskbarIconAssets) {
                $entryName = "Assets/AppTiles/Dev/$($asset.Name)"
                if (-not $identityArchive.GetEntry($entryName)) {
                  $entryName
                }
              }
            )
            if ($missingPackagedTaskbarIcons.Count -gt 0) {
              throw "Identity MSIX is missing taskbar icon variants: $($missingPackagedTaskbarIcons -join ', ')"
            }
            Write-Host "Verified $($taskbarIconAssets.Count) taskbar icon variants inside the identity MSIX."
          } finally {
            $identityArchive.Dispose()
          }

          # Keep the baseline identity and installer signed with the same
          # temporary Files certificate used by the package manifest.
          $pfxPasswordText = [guid]::NewGuid().ToString()
          $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Files' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'Files_SelfSigned' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $certificatePath -Type CERT | Out-Null

          & $signtool sign /f $pfxPath /p $pfxPasswordText /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $identityPackage
          if ($LASTEXITCODE -ne 0) {
            throw "Identity package signing failed with exit code $LASTEXITCODE."
          }

          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $vcRedistPath -UseBasicParsing
          if (-not (Test-Path -LiteralPath $vcRedistPath) -or (Get-Item $vcRedistPath).Length -lt 1MB) {
            throw 'Microsoft Visual C++ Redistributable download failed.'
          }

          $setupPath = Join-Path $workspace 'Files-Setup.exe'
          $nsis = Join-Path $workspace '.github\installer\Files-Baseline.nsi'
          $installScript = Join-Path $workspace 'Install-App.ps1'
          & 'C:\Program Files (x86)\NSIS\makensis.exe' `
            "/DAPP_VERSION=$appVersion" `
            "/DAPP_DISPLAY_VERSION=$installerVersion" `
            "/DPAYLOAD_DIR=$publishDir" `
            "/DIDENTITY_PACKAGE=$identityPackage" `
            "/DINSTALL_SCRIPT=$installScript" `
            "/DCERTIFICATE=$certificatePath" `
            "/DVC_REDIST=$vcRedistPath" `
            "/DOUTPUT_EXE=$setupPath" `
            $nsis
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $setupPath)) {
            throw 'Files baseline NSIS installer build failed.'
          }

          & $signtool sign /f $pfxPath /p $pfxPasswordText /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $setupPath
          if ($LASTEXITCODE -ne 0) {
            throw "Installer signing failed with exit code $LASTEXITCODE."
          }
          Remove-Item -LiteralPath $pfxPath -Force

      - name: Upload baseline installer
        uses: actions/upload-artifact@v7
        with:
          name: Files-Baseline
          path: Files-Setup.exe

      - name: Release baseline installer
        if: startsWith(github.ref, 'refs/tags/files-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Files-Setup.exe
          draft: false
          body: |
            ## Files

            Traditional Windows installer for the standard Files baseline.
