name: Build Files max

on:
  workflow_dispatch:
    inputs:
      fast_build:
        description: '快速测试构建：关闭 ReadyToRun 和服务端裁剪分析，减少发布耗时'
        required: false
        type: boolean
        default: true

concurrency:
  group: files-max-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FILES_MAX_FAST_BUILD: ${{ inputs.fast_build }}

jobs:
  build:
    outputs:
      installer_version: ${{ steps.installer_version.outputs.current }}
      next_installer_version: ${{ steps.installer_version.outputs.next }}
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine installer archive version
        id: installer_version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $currentVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Installer tags must use vMAJOR.MINOR.PATCH, got '$env:GITHUB_REF_NAME'."
            }
            $nextVersion = ''
          } else {
            $versionFile = Join-Path $env:GITHUB_WORKSPACE '.github\installer\build-version.txt'
            $currentVersion = (Get-Content -Raw -LiteralPath $versionFile).Trim()
            $parsedVersion = [regex]::Match($currentVersion, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
            if (-not $parsedVersion.Success) {
              throw "Invalid installer archive version in '$versionFile': $currentVersion"
            }
            $major = [int]$parsedVersion.Groups['major'].Value
            $minor = [int]$parsedVersion.Groups['minor'].Value
            $patch = [int]$parsedVersion.Groups['patch'].Value
            if ($patch -eq [int]::MaxValue) {
              throw "Installer patch version overflow: $currentVersion"
            }
            $nextVersion = '{0}.{1}.{2}' -f $major, $minor, ($patch + 1)
          }

          "current=$currentVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "next=$nextVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "This installer artifact will be named Files max Setup $currentVersion."

      - name: Preflight installer inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE

          # Catch PowerShell parser errors before the expensive Windows App
          # SDK publish. This specifically protects MSI custom actions, which
          # otherwise fail only after the application has been packaged.
          $scriptPath = Join-Path $workspace 'Install-App.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $details = $parseErrors | ForEach-Object { $_.Message }
            throw "Install-App.ps1 has PowerShell syntax errors: $($details -join '; ')"
          }
          $installScriptText = Get-Content -Raw -LiteralPath $scriptPath
          if (-not $installScriptText.Contains("(Split-Path -Leaf `$scriptDirectory) -ieq 'Installer'")) {
            throw 'Install-App.ps1 must resolve its install root from the parent of the Installer support directory.'
          }

          $xmlFiles = @(
            'src\Files.App\Package.appxmanifest',
            '.github\installer\ExternalLocation.AppxManifest',
            '.github\installer\wix\Files.Bundle.wxs',
            '.github\installer\wix\Files.Package.wxs',
            '.github\installer\wix\Files.Bundle.wixproj',
            '.github\installer\wix\Files.Package.wixproj',
            '.github\installer\wix\Files-Setup.Theme.xml',
            '.github\installer\wix\Files-Setup.zh-CN.wxl',
            '.github\installer\ba\InstallerWindow.xaml',
            '.github\installer\ba\FilesMax.Installer.Bootstrapper.csproj'
          ) | ForEach-Object { Join-Path $workspace $_ }
          foreach ($xmlFile in $xmlFiles) {
            try {
              [xml](Get-Content -Raw -LiteralPath $xmlFile) | Out-Null
            } catch {
              throw "Invalid installer XML '$xmlFile': $($_.Exception.Message)"
            }
          }

          # The installed script lives under INSTALLFOLDER\Installer and
          # derives the root from its own location. Passing INSTALLFOLDER in a
          # quoted MSI custom-action argument is fragile because its trailing
          # backslash interacts with Windows command-line quote parsing.
          $packageWix = Get-Content -Raw -LiteralPath (Join-Path $workspace '.github\installer\wix\Files.Package.wxs')
          if (-not $packageWix.Contains('<Exclude Files="$(var.PayloadDir)\e_sqlite3.dll" />')) {
            throw 'Files.Package.wxs must exclude e_sqlite3.dll from harvesting so its language-neutral File metadata is authored explicitly.'
          }
          if (-not $packageWix.Contains('Source="$(var.PayloadDir)\e_sqlite3.dll" DefaultLanguage="0" KeyPath="yes"')) {
            throw 'Files.Package.wxs must assign LANGID 0 to the language-neutral e_sqlite3.dll payload.'
          }
          if ($packageWix.Contains('-InstallDirectory &quot;[INSTALLFOLDER]')) {
            throw 'Files.Package.wxs must not pass INSTALLFOLDER as a quoted PowerShell custom-action argument.'
          }
          if (-not $packageWix.Contains('-File &quot;[#InstallAppScript]&quot; -Mode Install -AttemptId &quot;[INSTALLERATTEMPTID]&quot;')) {
            throw 'Files.Package.wxs must invoke Install-App.ps1 without a fragile trailing-separator argument.'
          }
          if (-not $packageWix.Contains('-File &quot;[#InstallAppScript]&quot; -Mode Uninstall -AttemptId &quot;[INSTALLERATTEMPTID]&quot;')) {
            throw 'The uninstall custom action must receive the per-operation installer attempt id.'
          }
          $bundleWix = Get-Content -Raw -LiteralPath (Join-Path $workspace '.github\installer\wix\Files.Bundle.wxs')
          if (-not $bundleWix.Contains('Name="InstallerAttemptId"')) {
            throw 'Files.Bundle.wxs must declare the installer attempt id variable.'
          }
          if (-not $bundleWix.Contains('<MsiProperty Name="INSTALLERATTEMPTID" Value="[InstallerAttemptId]" />')) {
            throw 'Files.Bundle.wxs must pass the custom BA attempt id through to the MSI.'
          }
          $bootstrapperSource = Get-Content -Raw -LiteralPath (Join-Path $workspace '.github\installer\ba\FilesBootstrapperApplication.cs')
          if (-not $bootstrapperSource.Contains('SetVariableString("InstallerAttemptId"')) {
            throw 'The custom bootstrapper must generate and set a unique attempt id before planning the MSI.'
          }
          if (-not $installScriptText.Contains('[string]$AttemptId =')) {
            throw 'Install-App.ps1 must accept the attempt id to create correlated unique log files.'
          }
          if (-not $installScriptText.Contains('Set-InstallStage')) {
            throw 'Install-App.ps1 must log named installation stages for failure diagnosis.'
          }
          if (-not $installScriptText.Contains("'{0}-{1}.log' -f `$logBaseName, `$AttemptId")) {
            throw 'Install-App.ps1 must preserve a separate uniquely named script log for each attempt.'
          }

          $requiredFiles = @(
            'src\Files.App\Assets\AppTiles\Dev\Logo.ico',
            'src\Files.App\Assets\AppTiles\Dev\FilesSiameseCatLogo.png',
            'src\Files.App\Assets\AppTiles\Dev\StoreLogo.scale-100.png',
            'src\Files.App\Assets\AppTiles\Dev\Square150x150Logo.scale-100.png',
            'src\Files.App\Assets\AppTiles\Dev\Square44x44Logo.scale-100.png',
            'src\Files.App\Assets\archives\ExtensionIcon.png',
            '.github\installer\wix\Files-Setup.Card.png',
            '.github\installer\wix\Files-Setup.CardTall.png',
            '.github\installer\wix\Files-Setup.ButtonPrimary.png',
            '.github\installer\wix\Files-Setup.ButtonPrimaryHover.png',
            '.github\installer\wix\Files-Setup.ButtonPrimarySelected.png',
            '.github\installer\wix\Files-Setup.ButtonPrimaryWide.png',
            '.github\installer\wix\Files-Setup.ButtonPrimaryWideHover.png',
            '.github\installer\wix\Files-Setup.ButtonPrimaryWideSelected.png',
            '.github\installer\wix\Files-Setup.ButtonSecondary.png',
            '.github\installer\wix\Files-Setup.ButtonSecondaryHover.png',
            '.github\installer\wix\Files-Setup.ButtonSecondarySelected.png',
            '.github\installer\ExternalLocation.AppxManifest',
            '.github\installer\ba\Program.cs',
            '.github\installer\ba\FilesBootstrapperApplication.cs',
            '.github\installer\ba\InstallerWindow.xaml.cs',
            '.github\installer\ba\ProgressWidthConverter.cs',
            '.github\installer\ba\FilesMax.Installer.Bootstrapper.csproj',
            'Install-App.ps1'
          ) | ForEach-Object { Join-Path $workspace $_ }
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingFiles.Count -gt 0) {
            throw "Required installer inputs are missing: $($missingFiles -join ', ')"
          }
          Write-Host "Installer preflight passed: $($xmlFiles.Count) XML files and $($requiredFiles.Count) required files checked."

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore publish output cache
        id: restore-publish
        uses: actions/cache@v5
        with:
          path: |
            artifacts/publish
            artifacts/server-publish
          key: ${{ runner.os }}-files-max-publish-${{ inputs.fast_build }}-${{ hashFiles('src/**/*', 'Directory.*', 'global.json', 'NuGet.config', 'Files.slnx') }}

      - name: Use installer-only NuGet package directory
        if: ${{ inputs.fast_build == true && steps.restore-publish.outputs.cache-hit == 'true' }}
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE '.nuget\installer-packages'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          "NUGET_PACKAGES=$packageDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache installer NuGet packages
        if: ${{ inputs.fast_build == true && steps.restore-publish.outputs.cache-hit == 'true' }}
        uses: actions/cache@v5
        with:
          path: .nuget/installer-packages
          key: ${{ runner.os }}-files-max-installer-nuget-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'nuget.config', 'global.json', '.github/installer/**/*.csproj', '.github/installer/**/*.wixproj', 'src/Files.App.Launcher/Files.App.Launcher.vcxproj', 'src/Files.App.Launcher/packages.config') }}

      - name: Cache NuGet packages
        # A fast build with a publish-cache hit only needs installer packages.
        # Restoring the complete app's 2+ GB NuGet cache costs more than the
        # targeted installer restores, so keep that cache for full builds and
        # fast cache misses only.
        if: ${{ inputs.fast_build != true || steps.restore-publish.outputs.cache-hit != 'true' }}
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore
        shell: pwsh
        env:
          FILES_MAX_PUBLISH_CACHE_HIT: ${{ steps.restore-publish.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FILES_MAX_FAST_BUILD -eq 'true' -and $env:FILES_MAX_PUBLISH_CACHE_HIT -eq 'true') {
            Write-Host 'Fast build with a publish cache hit; skipping full solution restore.'
            return
          }
          msbuild "${{ github.workspace }}\Files.slnx" -m -t:Restore -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            throw 'Solution restore failed.'
          }

      - name: Restore launcher dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore "$env:GITHUB_WORKSPACE\src\Files.App.Launcher\Files.App.Launcher.vcxproj" `
            -SolutionDirectory "$env:GITHUB_WORKSPACE" `
            -Verbosity quiet
          if ($LASTEXITCODE -ne 0) {
            throw 'Launcher dependency restore failed.'
          }

      - name: Restore installer projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $projects = @(
            (Join-Path $workspace '.github\installer\ba\FilesMax.Installer.Bootstrapper.csproj'),
            (Join-Path $workspace '.github\installer\wix\Files.Package.wixproj'),
            (Join-Path $workspace '.github\installer\wix\Files.Bundle.wixproj')
          )
          foreach ($project in $projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) {
              throw "Installer project restore failed: $project"
            }
          }

      - name: Preflight custom bootstrapper build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $baProject = Join-Path $workspace '.github\installer\ba\FilesMax.Installer.Bootstrapper.csproj'
          $preflightOutput = Join-Path $workspace 'artifacts\installer\ba-preflight'
          New-Item -ItemType Directory -Path $preflightOutput -Force | Out-Null

          # Compile the complete managed bootstrapper before publishing the
          # large Files application. This catches C#/XAML/API errors in
          # seconds instead of after the expensive application publish.
          dotnet build $baProject `
            -m `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            "-p:OutputPath=$preflightOutput\" `
            -v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw 'Custom bootstrapper preflight build failed.'
          }
          $preflightAssembly = Get-ChildItem -LiteralPath $preflightOutput -Recurse -Filter 'FilesMax.Installer.Bootstrapper.dll' -File |
            Select-Object -First 1
          if (-not $preflightAssembly) {
            throw 'Custom bootstrapper preflight output is incomplete.'
          }
          Write-Host 'Custom bootstrapper preflight build passed.'

      - name: Preflight external installer tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $artifactDir = Join-Path $workspace 'artifacts'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $makeAppx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeAppx -or -not $signtool) {
            throw 'Windows SDK makeappx.exe or signtool.exe was not found.'
          }

          # Download external prerequisites before the expensive Files
          # publish. Retry transient network failures without rerunning the
          # complete workflow.
          $vcRedistPath = Join-Path $artifactDir 'VC_redist.x64.exe'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest `
                -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' `
                -OutFile $vcRedistPath `
                -TimeoutSec 120 `
                -UseBasicParsing
              if ((Test-Path -LiteralPath $vcRedistPath) -and (Get-Item $vcRedistPath).Length -ge 1MB) {
                $downloaded = $true
                break
              }
              throw 'Downloaded VC++ Redistributable is incomplete.'
            }
            catch {
              if ($attempt -eq 3) {
                throw "Microsoft Visual C++ Redistributable download failed after $attempt attempts: $($_.Exception.Message)"
              }
              Write-Host "VC++ Redistributable download attempt $attempt failed; retrying."
              Start-Sleep -Seconds 5
            }
          }
          if (-not $downloaded) {
            throw 'Microsoft Visual C++ Redistributable was not downloaded.'
          }

          $wixToolDir = Join-Path $artifactDir 'wix-cli'
          $wixTool = Join-Path $wixToolDir 'wix.exe'
          if (-not (Test-Path -LiteralPath $wixTool)) {
            $wixInstalled = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Remove-Item -LiteralPath $wixToolDir -Recurse -Force -ErrorAction SilentlyContinue
              dotnet tool install wix --version 7.0.0 --tool-path $wixToolDir
              if ($LASTEXITCODE -eq 0) {
                $wixInstalled = $true
                break
              }
              if ($attempt -lt 3) {
                Write-Host "WiX tool installation attempt $attempt failed; retrying."
                Start-Sleep -Seconds 5
              }
            }
            if (-not $wixInstalled) {
              throw 'WiX command-line tool installation failed during preflight.'
            }
          }
          if (-not (Test-Path -LiteralPath $wixTool)) {
            throw "WiX command-line tool was not installed at '$wixTool'."
          }
          & $wixTool eula accept wix7
          if ($LASTEXITCODE -ne 0) {
            throw 'WiX command-line tool EULA acceptance failed during preflight.'
          }

          "FILES_MAX_VC_REDIST_PATH=$vcRedistPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FILES_MAX_WIX_TOOL=$wixTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'External installer tools preflight passed.'

      - name: Build launcher
        shell: pwsh
        run: |
          msbuild "$env:GITHUB_WORKSPACE\src\Files.App.Launcher\Files.App.Launcher.vcxproj" `
            -m `
            -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw 'Files.App.Launcher build failed.'
          }
          if (-not (Test-Path -LiteralPath "$env:GITHUB_WORKSPACE\src\Files.App\Assets\FilesOpenDialog\Files.App.Launcher.exe")) {
            throw 'Files.App.Launcher.exe was not produced.'
          }

      - name: Publish unpackaged application
        shell: pwsh
        env:
          FILES_MAX_PUBLISH_CACHE_HIT: ${{ steps.restore-publish.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish'
          $publishReadyToRun = if ($env:FILES_MAX_FAST_BUILD -eq 'true') { 'false' } else { 'true' }
          $publishTrimmed = if ($env:FILES_MAX_FAST_BUILD -eq 'true') { 'false' } else { 'true' }
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          $appPublishTimer = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            if ($env:FILES_MAX_PUBLISH_CACHE_HIT -eq 'true') {
              Write-Host 'Publish output cache hit; skipping the full Files application publish.'
            } else {
              msbuild "$env:GITHUB_WORKSPACE\src\Files.App\Files.App.csproj" `
                -m `
                -t:Publish `
                -p:Configuration=Release `
                -p:Platform=x64 `
                -p:RuntimeIdentifier=win-x64 `
                -p:SelfContained=true `
                -p:WindowsPackageType=None `
                -p:FilesExternalLocationBuild=true `
                -p:FilesResourceManagerBuild=true `
                "-p:PublishReadyToRun=$publishReadyToRun" `
                "-p:PublishReadyToRunComposite=$publishReadyToRun" `
                -p:GenerateAppxPackageOnBuild=false `
                "-p:PublishDir=$publishDir\" `
                -v:minimal

              if ($LASTEXITCODE -ne 0) {
                throw 'Unpackaged Files application publish failed.'
              }
            }
          } finally {
            $appPublishTimer.Stop()
            Write-Host "Files application publish phase: $($appPublishTimer.Elapsed); cacheHit=$($env:FILES_MAX_PUBLISH_CACHE_HIT)."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'Files.exe'))) {
            throw 'Unpackaged Files.exe was not produced.'
          }

          $runtimeFiles = @(Get-ChildItem -LiteralPath $publishDir -Filter 'Microsoft.WindowsAppRuntime*.dll' -File)
          if ($runtimeFiles.Count -eq 0) {
            throw 'Windows App SDK self-contained runtime was not copied to the publish output.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'resources.pri'))) {
            throw 'resources.pri was not copied to the publish output.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'e_sqlite3.dll'))) {
            throw 'e_sqlite3.dll was not copied to the publish output required by the explicit MSI component.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'Assets'))) {
            throw 'Application assets were not copied to the publish output.'
          }
          $winrtHostPath = Join-Path $publishDir 'WinRT.Host.dll'
          if (-not (Test-Path -LiteralPath $winrtHostPath)) {
            $generatedHost = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\src\Files.App.BackgroundTasks\bin" -Recurse -Filter 'WinRT.Host.dll' -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($generatedHost) {
              Copy-Item -LiteralPath $generatedHost.FullName -Destination $winrtHostPath -Force
            }
          }
          if (-not (Test-Path -LiteralPath $winrtHostPath)) {
            throw 'WinRT.Host.dll was not copied to the publish output.'
          }

          $serverPublishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\server-publish'
          New-Item -ItemType Directory -Path $serverPublishDir -Force | Out-Null
          $serverPublishTimer = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            if ($env:FILES_MAX_PUBLISH_CACHE_HIT -eq 'true') {
              Write-Host 'Server publish output cache hit; skipping the server publish.'
            } else {
              msbuild "$env:GITHUB_WORKSPACE\src\Files.App.Server\Files.App.Server.csproj" `
                -m `
                -t:Publish `
                -p:Configuration=Release `
                -p:Platform=x64 `
                -p:RuntimeIdentifier=win-x64 `
                -p:SelfContained=true `
                "-p:PublishTrimmed=$publishTrimmed" `
                "-p:PublishReadyToRun=$publishReadyToRun" `
                "-p:PublishReadyToRunComposite=$publishReadyToRun" `
                "-p:PublishDir=$serverPublishDir\" `
                -v:minimal

              if ($LASTEXITCODE -ne 0) {
                throw 'Files.App.Server publish failed.'
              }
            }
          } finally {
            $serverPublishTimer.Stop()
            Write-Host "Files server publish phase: $($serverPublishTimer.Elapsed); cacheHit=$($env:FILES_MAX_PUBLISH_CACHE_HIT)."
          }
          $serverExe = Get-ChildItem -LiteralPath $serverPublishDir -Filter 'Files.App.Server.exe' -File | Select-Object -First 1
          if (-not $serverExe) {
            throw 'Files.App.Server.exe was not produced.'
          }
          $serverPayloadDir = Join-Path $publishDir 'Files.App.Server'
          $serverPayloadExe = Join-Path $serverPayloadDir 'Files.App.Server.exe'
          if ($env:FILES_MAX_PUBLISH_CACHE_HIT -eq 'true' -and (Test-Path -LiteralPath $serverPayloadExe -PathType Leaf)) {
            Write-Host 'Server payload is already present in the restored publish cache; skipping redundant copy.'
          } else {
            $payloadCopyTimer = [System.Diagnostics.Stopwatch]::StartNew()
            try {
              New-Item -ItemType Directory -Path $serverPayloadDir -Force | Out-Null
              Copy-Item -Path (Join-Path $serverPublishDir '*') -Destination $serverPayloadDir -Recurse -Force
            } finally {
              $payloadCopyTimer.Stop()
              Write-Host "Files server payload copy phase: $($payloadCopyTimer.Elapsed)."
            }
          }
          Write-Host "Self-contained runtime files: $($runtimeFiles.Name -join ', ')"

      - name: Build external-location identity package and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $publishDir = Join-Path $workspace 'artifacts\publish'
          $identityDir = Join-Path $workspace 'artifacts\identity'
          $identityPackage = Join-Path $workspace 'artifacts\Files.Identity.msix'
          $certificatePath = Join-Path $workspace 'artifacts\Files.cer'
          $vcRedistPath = $env:FILES_MAX_VC_REDIST_PATH
          $pfxPath = Join-Path $workspace 'artifacts\sign.pfx'
          $wixTool = $env:FILES_MAX_WIX_TOOL
          if (-not (Test-Path -LiteralPath $vcRedistPath)) {
            throw "Preflight VC++ Redistributable is missing at '$vcRedistPath'."
          }
          if (-not (Test-Path -LiteralPath $wixTool)) {
            throw "Preflight WiX command-line tool is missing at '$wixTool'."
          }

          $sourcePackageManifest = Join-Path $workspace 'src\Files.App\Package.appxmanifest'
          [xml]$sourceManifest = Get-Content -LiteralPath $sourcePackageManifest
          $appVersion = [string]$sourceManifest.Package.Identity.Version
          if ($appVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Invalid package version: $appVersion"
          }

          New-Item -ItemType Directory -Path $identityDir -Force | Out-Null
          $identityManifestPath = Join-Path $identityDir 'AppxManifest.xml'
          Copy-Item "$workspace\.github\installer\ExternalLocation.AppxManifest" $identityManifestPath -Force
          [xml]$identityManifest = Get-Content -LiteralPath $identityManifestPath
          $identityManifest.Package.Identity.Version = $appVersion
          $identityManifest.Save($identityManifestPath)

          $identityAssetDir = Join-Path $identityDir 'Assets\AppTiles\Dev'
          New-Item -ItemType Directory -Path $identityAssetDir -Force | Out-Null
          Copy-Item "$workspace\src\Files.App\Assets\AppTiles\Dev\StoreLogo.scale-100.png" $identityAssetDir -Force
          Copy-Item "$workspace\src\Files.App\Assets\AppTiles\Dev\Square150x150Logo.scale-100.png" $identityAssetDir -Force
          Copy-Item "$workspace\src\Files.App\Assets\AppTiles\Dev\Square44x44Logo.scale-100.png" $identityAssetDir -Force
          $archiveAssetDir = Join-Path $identityDir 'Assets\archives'
          New-Item -ItemType Directory -Path $archiveAssetDir -Force | Out-Null
          Copy-Item "$workspace\src\Files.App\Assets\archives\ExtensionIcon.png" $archiveAssetDir -Force

          $makeAppx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeAppx -or -not $signtool) {
            throw 'Windows SDK makeappx.exe or signtool.exe was not found.'
          }

          function Invoke-SignFile {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$Description
            )

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & $signtool sign /f $pfxPath /p $pfxPasswordText /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $Path
              if ($LASTEXITCODE -eq 0) {
                return
              }
              if ($attempt -lt 3) {
                Write-Host "$Description timestamp/signing attempt $attempt failed; retrying."
                Start-Sleep -Seconds 5
              }
            }
            throw "$Description signing failed after 3 attempts."
          }

          & $makeAppx pack /o /d $identityDir /nv /p $identityPackage
          if ($LASTEXITCODE -ne 0) {
            throw "Identity package creation failed with exit code $LASTEXITCODE."
          }

          # This is an unpackaged development-style build. Generate the
          # matching temporary identity certificate on the runner so the
          # package, installer, and Windows identity all use the Files name.
          $pfxPasswordText = [guid]::NewGuid().ToString()
          $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Files' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'Files_SelfSigned' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $certificatePath -Type CERT | Out-Null

          Invoke-SignFile -Path $identityPackage -Description 'Identity package'

          $setupPath = Join-Path $workspace 'Files max Setup.exe'
          $msiOutputDir = Join-Path $workspace 'artifacts\installer\msi'
          $bundleOutputDir = Join-Path $workspace 'artifacts\installer\bundle'
          $baProject = Join-Path $workspace '.github\installer\ba\FilesMax.Installer.Bootstrapper.csproj'
          $baOutputDir = Join-Path $workspace 'artifacts\installer\ba'
          $baPayloadWxs = Join-Path $workspace 'artifacts\installer\GeneratedBootstrapperPayloads.wxs'
          $installScript = Join-Path $workspace 'Install-App.ps1'
          $packageProject = Join-Path $workspace '.github\installer\wix\Files.Package.wixproj'
          $bundleProject = Join-Path $workspace '.github\installer\wix\Files.Bundle.wixproj'

          New-Item -ItemType Directory -Path $msiOutputDir, $bundleOutputDir -Force | Out-Null

          dotnet build $packageProject `
            -m `
            --configuration Release `
            --no-restore `
            "-p:AppVersion=$appVersion" `
            "-p:ProductName=Files max" `
            "-p:PayloadDir=$publishDir" `
            "-p:InstallScript=$installScript" `
            "-p:IdentityPackage=$identityPackage" `
            "-p:Certificate=$certificatePath" `
            "-p:OutputPath=$msiOutputDir\" `
            -v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw 'WiX MSI build failed.'
          }

          # WiX may place localized outputs in a culture subdirectory (for
          # example, msi\zh-CN) depending on the SDK version. Resolve the
          # actual file instead of assuming it is directly under OutputPath.
          $msiCandidates = @(Get-ChildItem -LiteralPath $msiOutputDir -Recurse -Filter 'Files max Installer.msi' -File)
          if ($msiCandidates.Count -ne 1) {
            throw "Expected exactly one WiX MSI under '$msiOutputDir', found $($msiCandidates.Count)."
          }
          $msiPath = $msiCandidates[0].FullName

          # WiX reads the VERSIONINFO language from every PE file. A small
          # number of native .NET runtime files publish a non-numeric language
          # string, which is not legal in the MSI File table. Keep the MSI
          # valid and language-neutral for this non-localized application.
          $msiDatabase = New-Object -ComObject WindowsInstaller.Installer
          $msiTransaction = $msiDatabase.OpenDatabase($msiPath, 1)

          # ICE60 reports only the generated File identifier, which is not
          # actionable on its own. Log the corresponding names for versioned
          # files whose language metadata is absent so the next warning can
          # be traced to its publish input without suppressing ICE validation.
          $msiView = $msiTransaction.OpenView("SELECT ``File``, ``FileName``, ``Version`` FROM ``File`` WHERE ``Version`` IS NOT NULL AND ``Language`` IS NULL")
          $msiView.Execute()
          while ($msiRecord = $msiView.Fetch()) {
            Write-Host ("MSI ICE60 diagnostic candidate: FileId='{0}', FileName='{1}', Version='{2}'" -f `
              $msiRecord.StringData(1), $msiRecord.StringData(2), $msiRecord.StringData(3))
            [void][Runtime.InteropServices.Marshal]::ReleaseComObject($msiRecord)
          }
          $msiView.Close()
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($msiView)

          $msiView = $msiTransaction.OpenView("UPDATE ``File`` SET ``Language`` = '0' WHERE ``Language`` IS NOT NULL")
          $msiView.Execute()
          $msiView.Close()
          $msiTransaction.Commit()
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($msiView)
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($msiTransaction)
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($msiDatabase)

          Invoke-SignFile -Path $msiPath -Description 'MSI'

          # Build the custom WPF bootstrapper after the MSI is known to be
          # valid. It owns the complete Files max installer UI while Burn
          # continues to provide the trusted detect/plan/apply engine.
          New-Item -ItemType Directory -Path $baOutputDir -Force | Out-Null
          dotnet publish $baProject `
            -m `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            "-p:PublishDir=$baOutputDir\" `
            -v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw 'Custom bootstrapper publish failed.'
          }

          $baCandidates = @(Get-ChildItem -LiteralPath $baOutputDir -Recurse -Filter 'FilesMax.Installer.Bootstrapper.exe' -File)
          if ($baCandidates.Count -ne 1) {
            throw "Expected exactly one custom bootstrapper under '$baOutputDir', found $($baCandidates.Count)."
          }
          $baPath = $baCandidates[0].FullName

          # A managed BA is launched by Burn in its own extracted directory.
          # Keep the published BA as a normal self-contained folder and add
          # every published dependency to the BA payload group. In
          # particular, mbanative.dll must be beside the BA at runtime.
          $nativeMba = Get-ChildItem -LiteralPath $baOutputDir -Recurse -Filter 'mbanative.dll' -File |
            Select-Object -First 1
          if (-not $nativeMba) {
            throw "The published custom bootstrapper does not contain mbanative.dll under '$baOutputDir'."
          }
          $nativeMbaAtRoot = Join-Path $baOutputDir 'mbanative.dll'
          if ($nativeMba.FullName -ne $nativeMbaAtRoot) {
            Copy-Item -LiteralPath $nativeMba.FullName -Destination $nativeMbaAtRoot -Force
          }

          $baPayloadWxs = Join-Path $workspace 'artifacts\installer\GeneratedBootstrapperPayloads.wxs'
          $xmlSettings = New-Object System.Xml.XmlWriterSettings
          $xmlSettings.Indent = $true
          $xmlSettings.OmitXmlDeclaration = $false
          $xmlWriter = [System.Xml.XmlWriter]::Create($baPayloadWxs, $xmlSettings)
          $xmlWriter.WriteStartDocument()
          $xmlWriter.WriteStartElement('Wix', 'http://wixtoolset.org/schemas/v4/wxs')
          $xmlWriter.WriteStartElement('Fragment')
          $xmlWriter.WriteStartElement('PayloadGroup')
          $xmlWriter.WriteAttributeString('Id', 'FilesMaxBootstrapperPayloads')
          $mainBootstrapperName = [System.IO.Path]::GetFileName($baPath)
          $payloadEntries = @(
            foreach ($baFile in Get-ChildItem -LiteralPath $baOutputDir -Recurse -File) {
              # The BA executable is supplied by SourceFile. Never add a
              # second copy by basename, even if a publish layout changes
              # the path casing or creates another output folder.
              if ($baFile.Name -ieq $mainBootstrapperName) {
                continue
              }
              $relativeName = [System.IO.Path]::GetRelativePath($baOutputDir, $baFile.FullName).Replace('/', '\')
              [pscustomobject]@{
                SourceFile = $baFile.FullName
                Name = $relativeName
              }
            }
          )
          $duplicatePayloads = @($payloadEntries | Group-Object -Property Name | Where-Object Count -gt 1)
          if ($duplicatePayloads.Count -gt 0) {
            $duplicateNames = $duplicatePayloads | ForEach-Object { $_.Name }
            $xmlWriter.Close()
            throw "Bootstrapper payload names are not unique: $($duplicateNames -join ', ')"
          }
          foreach ($payloadEntry in $payloadEntries) {
            $xmlWriter.WriteStartElement('Payload')
            $xmlWriter.WriteAttributeString('SourceFile', $payloadEntry.SourceFile)
            $xmlWriter.WriteAttributeString('Name', $payloadEntry.Name)
            $xmlWriter.WriteEndElement()
          }
          $xmlWriter.WriteEndElement()
          $xmlWriter.WriteEndElement()
          $xmlWriter.WriteEndElement()
          $xmlWriter.WriteEndDocument()
          $xmlWriter.Close()

          foreach ($requiredBaFile in @(
              'FilesMax.Installer.Bootstrapper.dll',
              'FilesMax.Installer.Bootstrapper.deps.json',
              'FilesMax.Installer.Bootstrapper.runtimeconfig.json',
              'WixToolset.BootstrapperApplicationApi.dll',
              'mbanative.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $baOutputDir $requiredBaFile))) {
              throw "Required custom bootstrapper payload '$requiredBaFile' was not published at the BA root."
            }
          }

          dotnet build $bundleProject `
            -m `
            --configuration Release `
            --no-restore `
            "-p:AppVersion=$appVersion" `
            "-p:ProductName=Files max" `
            "-p:MsiPath=$msiPath" `
            "-p:VCRedistPath=$vcRedistPath" `
            "-p:BootstrapperApplicationPath=$baPath" `
            "-p:BootstrapperApplicationPayloadsPath=$baPayloadWxs" `
            "-p:OutputPath=$bundleOutputDir\" `
            -v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw 'WiX Burn bundle build failed.'
          }

          $bundleCandidates = @(Get-ChildItem -LiteralPath $bundleOutputDir -Recurse -Filter 'Files max Setup.exe' -File)
          if ($bundleCandidates.Count -ne 1) {
            throw "Expected exactly one WiX Burn bundle under '$bundleOutputDir', found $($bundleCandidates.Count)."
          }
          $builtBundlePath = $bundleCandidates[0].FullName

          # Burn bundles must be signed in two stages. Signing the final EXE
          # directly leaves the attached container offsets invalid, which
          # makes Burn unable to extract the MSI or VC++ redistributable.
          $enginePath = Join-Path $bundleOutputDir 'Files max Installer-Engine.exe'
          $reattachedBundlePath = Join-Path $bundleOutputDir 'Files max Setup-signed.exe'

          & $wixTool burn detach $builtBundlePath -engine $enginePath
          if ($LASTEXITCODE -ne 0) {
            throw "Burn engine detach failed with exit code $LASTEXITCODE."
          }

          Invoke-SignFile -Path $enginePath -Description 'Burn engine'

          & $wixTool burn reattach $builtBundlePath -engine $enginePath -out $reattachedBundlePath
          if ($LASTEXITCODE -ne 0) {
            throw "Burn engine reattach failed with exit code $LASTEXITCODE."
          }

          Copy-Item -LiteralPath $reattachedBundlePath -Destination $setupPath -Force

          Invoke-SignFile -Path $setupPath -Description 'Final installer'
          Remove-Item -LiteralPath $pfxPath -Force

          Get-ChildItem -LiteralPath $setupPath |
            Select-Object Name, @{N = 'MB'; E = { [math]::Round($_.Length / 1MB, 1) }}

      - name: Save candidate installer for smoke test
        uses: actions/cache/save@v5
        with:
          path: Files max Setup.exe
          key: files-max-candidate-${{ github.run_id }}

  smoke-test:
    name: Smoke test installer
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout version state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Restore candidate installer from internal cache
        uses: actions/cache/restore@v5
        with:
          path: Files max Setup.exe
          key: files-max-candidate-${{ github.run_id }}

      - name: Validate candidate installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $setupPath = Join-Path $workspace 'Files max Setup.exe'
          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "Candidate installer was not restored: $setupPath"
          }
          if ((Get-Item -LiteralPath $setupPath).Length -lt 1MB) {
            throw "Candidate installer is unexpectedly small: $setupPath"
          }
          Write-Host "Smoke-test installer: $setupPath"

      - name: Smoke test install, startup, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setupPath = Join-Path $env:GITHUB_WORKSPACE 'Files max Setup.exe'
          # Keep the smoke-test path free of spaces so the Burn variable
          # assignment is passed exactly as intended through Start-Process.
          $installDir = Join-Path $env:ProgramData 'FilesInstallerSmoke'
          $installedExe = Join-Path $installDir 'Files.exe'
          $installFolderArgument = 'InstallFolder="{0}"' -f $installDir
          $installLog = Join-Path $env:TEMP 'files-max-installer-install.log'
          $smokeStartedAt = Get-Date

          $installLogArgument = '/log={0}' -f $installLog
          $installerProcess = Start-Process -FilePath $setupPath -ArgumentList '/quiet', '/norestart', $installLogArgument, $installFolderArgument -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installLog) {
              Write-Host 'Burn installer log:'
              Get-Content -LiteralPath $installLog
            }
            # MSI deferred custom actions can inherit the Windows Installer
            # service temp directory instead of the runner user's temp
            # directory. Dump both locations so identity-registration errors
            # are visible in the Actions log when an install rolls back.
            $diagnosticRoots = @($env:TEMP, (Join-Path $env:SystemRoot 'Temp')) | Select-Object -Unique
            $diagnosticLogs = foreach ($diagnosticRoot in $diagnosticRoots) {
              Get-ChildItem -Path $diagnosticRoot -Filter '*.log' -File -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -ge $smokeStartedAt.AddMinutes(-1) }
            }
            $diagnosticLogs = $diagnosticLogs | Sort-Object FullName -Unique
            foreach ($diagnosticLog in $diagnosticLogs) {
              Write-Host "Installer diagnostic log: $($diagnosticLog.FullName)"
              Get-Content -LiteralPath $diagnosticLog.FullName
            }
            $applicationEvents = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $smokeStartedAt.AddMinutes(-1) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'FilesMax|Bootstrapper|hostfxr|\.NET Runtime|Application Error|SideBySide' } |
              Select-Object -First 20
            foreach ($applicationEvent in $applicationEvents) {
              Write-Host "Windows application event: $($applicationEvent.ProviderName) $($applicationEvent.Id)"
              Write-Host $applicationEvent.Message
            }
            throw "Silent installer failed with exit code $($installerProcess.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $installedExe)) {
            if (Test-Path -LiteralPath $installLog) {
              Write-Host 'Burn installer log (installer returned success but the target file is missing):'
              Get-Content -LiteralPath $installLog
            }
            $burnLogs = Get-ChildItem -Path $env:TEMP -Filter 'Files_max_*.log' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -ge $smokeStartedAt.AddMinutes(-1) } |
              Sort-Object LastWriteTime
            foreach ($burnLog in $burnLogs) {
              Write-Host "Burn log: $($burnLog.FullName)"
              Get-Content -LiteralPath $burnLog.FullName
            }
            $baErrorLog = Join-Path $env:TEMP 'FilesMax.Installer.Bootstrapper.error.log'
            if (Test-Path -LiteralPath $baErrorLog) {
              Write-Host 'Bootstrapper error log:'
              Get-Content -LiteralPath $baErrorLog
            }
            throw "Files.exe was not installed to '$installDir'."
          }

          $identity = Get-AppxPackage -Name 'FilesDev' -ErrorAction SilentlyContinue |
            Where-Object { $_.Publisher -eq 'CN=Files' -and $_.Status -eq 'Ok' } |
            Select-Object -First 1
          if (-not $identity) {
            throw 'External-location identity was not registered.'
          }

          $appProcess = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 5
          if ($appProcess.HasExited) {
            $localStateDir = Join-Path $env:LOCALAPPDATA "Packages\$($identity.PackageFamilyName)\LocalState"
            $debugLog = Join-Path $localStateDir 'debug.log'
            if (Test-Path -LiteralPath $debugLog) {
              Write-Host 'Files debug.log:'
              Get-Content -LiteralPath $debugLog
            } else {
              Write-Host "Files debug.log was not found at '$debugLog'."
              Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Packages') -Directory -Filter 'FilesDev_*' -ErrorAction SilentlyContinue |
                ForEach-Object { Get-ChildItem -Path $_.FullName -Recurse -Filter 'debug.log' -File -ErrorAction SilentlyContinue } |
                ForEach-Object { Write-Host "Candidate log: $($_.FullName)"; Get-Content -LiteralPath $_.FullName }
            }
            throw "Files exited during startup with code $($appProcess.ExitCode)."
          }
          Write-Host "Startup smoke test passed with process id $($appProcess.Id)."
          Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue

          $repairProcess = Start-Process -FilePath $setupPath -ArgumentList '/repair', '/quiet', '/norestart' -Wait -PassThru
          if ($repairProcess.ExitCode -ne 0) {
            throw "Silent repair failed with exit code $($repairProcess.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw "Files.exe disappeared after repair from '$installDir'."
          }

          $uninstallEntries = @(
            Get-ChildItem -Path @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            ) -ErrorAction SilentlyContinue |
              ForEach-Object {
                Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction SilentlyContinue
              } |
              Where-Object { $_.DisplayName -eq 'Files max' }
          )
          $uninstallEntry = $uninstallEntries |
            Where-Object { $_.QuietUninstallString -match 'Files max Setup\.exe|Files-Setup\.exe' -or $_.UninstallString -match 'Files max Setup\.exe|Files-Setup\.exe' } |
            Select-Object -First 1
          if (-not $uninstallEntry) {
            $uninstallEntry = $uninstallEntries | Select-Object -First 1
          }
          if (-not $uninstallEntry) {
            throw 'Files was not registered in Add/Remove Programs.'
          }
          $uninstallCommand = $uninstallEntry.QuietUninstallString
          if ([string]::IsNullOrWhiteSpace($uninstallCommand)) {
            $uninstallCommand = $uninstallEntry.UninstallString
          }
          if ([string]::IsNullOrWhiteSpace($uninstallCommand)) {
            throw 'The WiX bundle uninstall command was not registered.'
          }
          $uninstallerProcess = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', $uninstallCommand -Wait -PassThru
          if ($uninstallerProcess.ExitCode -ne 0) {
            throw "Silent uninstaller failed with exit code $($uninstallerProcess.ExitCode)."
          }
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $remainingIdentity = @(Get-AppxPackage -Name 'FilesDev' -ErrorAction SilentlyContinue)
            if ($remainingIdentity.Count -eq 0) {
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if ($remainingIdentity.Count -gt 0) {
            Write-Host ($remainingIdentity | Select-Object PackageFullName, Publisher, Status | Out-String)
            throw 'External-location identity remained registered after uninstall.'
          }

      - name: Advance installer archive version
        if: github.ref_type == 'branch'
        shell: pwsh
        env:
          BUILT_VERSION: ${{ needs.build.outputs.installer_version }}
          NEXT_VERSION: ${{ needs.build.outputs.next_installer_version }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFile = Join-Path $env:GITHUB_WORKSPACE '.github\installer\build-version.txt'
          $recordedVersion = (Get-Content -Raw -LiteralPath $versionFile).Trim()
          if ($recordedVersion -ne $env:BUILT_VERSION) {
            throw "Installer version changed during the build: expected $env:BUILT_VERSION, found $recordedVersion. No version was advanced."
          }
          if ($env:NEXT_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid next installer version: $env:NEXT_VERSION"
          }

          Set-Content -LiteralPath $versionFile -Value $env:NEXT_VERSION -NoNewline -Encoding ascii
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/installer/build-version.txt
          git commit -m "Advance installer archive version to $env:NEXT_VERSION"
          git push origin "HEAD:refs/heads/$env:BUILD_BRANCH"

      - name: Stage versioned installer artifact
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ needs.build.outputs.installer_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE 'Files max Setup.exe'
          $artifactPath = Join-Path $env:GITHUB_WORKSPACE "Files max Setup $env:INSTALLER_VERSION.exe"
          Copy-Item -LiteralPath $sourcePath -Destination $artifactPath -Force
          if ((Get-Item -LiteralPath $artifactPath).Length -ne (Get-Item -LiteralPath $sourcePath).Length) {
            throw 'Versioned installer artifact does not match the verified installer size.'
          }

      - name: Upload verified installer
        uses: actions/upload-artifact@v7
        with:
          name: Files max Setup ${{ needs.build.outputs.installer_version }}
          path: Files max Setup ${{ needs.build.outputs.installer_version }}.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Files max Setup.exe
          draft: false
          body: |
            ## Files max

            Traditional installer for Windows 10/11. Files max is installed as a normal desktop application under Program Files.

            - Full Files max file manager
            - resource code detection
            - Health check / batch rename
            - Subtitle classification / undo
